<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Quadra Solidária</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body style="background:#0f172a;color:white;">

    <nav class="navbar navbar-dark bg-dark px-4">

        <span class="navbar-brand">
            ⚽ Quadra Solidária
        </span>

        <button id="btnSair" class="btn btn-danger">
            Sair
        </button>

    </nav>

    <div class="container py-5">

        <div class="text-center mb-5">

            <h1>Bem-vindo ao painel</h1>

            <p>
                Você está logado no sistema
                Quadra Solidária.
            </p>

        </div>

        <div class="row g-4">

            <div class="col-md-4">
                <div class="card p-4 bg-dark text-light">
                    <h3>Eventos</h3>
                    <p>Gerencie eventos esportivos</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-4 bg-dark text-light">
                    <h3>Campeonatos</h3>
                    <p>Gerencie ranking e equipes</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-4 bg-dark text-light">
                    <h3>Quadras</h3>
                    <p>Gerencie reservas</p>
                </div>
            </div>

        </div>

    </div>

    <script>

    // verifica login
    const usuarioLogado =
        localStorage.getItem(
            'usuarioLogado'
        );

    if (!usuarioLogado) {

        window.location.href =
            'login.html';

    }

    // botão sair
    const btnSair =
        document.getElementById(
            'btnSair'
        );

    btnSair.addEventListener(
        'click',
        function () {

            // remove sessão
            localStorage.removeItem(
                'usuarioLogado'
            );

            // cria alerta visual
            const mensagem =
                document.createElement('div');

            mensagem.className =
                'alert alert-warning text-center position-fixed top-0 start-50 translate-middle-x mt-3 shadow';

            mensagem.style.zIndex =
                '9999';

            mensagem.innerHTML =
                'Logout realizado com sucesso. Redirecionando...';

            document.body.appendChild(
                mensagem
            );

            // redireciona após 2 segundos
            setTimeout(() => {

                window.location.href =
                    'index.html';

            }, 2000);

        }
    );

</script>

</body>

</html>
