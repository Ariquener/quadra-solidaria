<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Quadra Solidária</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#0f172a;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:Arial,sans-serif;
        }

        .login-box{
            width:100%;
            max-width:420px;
            background:#111827;
            padding:40px;
            border-radius:25px;
            box-shadow:0 10px 40px rgba(0,0,0,0.35);
        }

        h1{
            color:white;
            text-align:center;
            margin-bottom:10px;
        }

        p{
            color:#94a3b8;
            text-align:center;
            margin-bottom:30px;
        }

        label{
            color:white;
        }

        .btn-success{
            background:#22c55e;
            border:none;
            padding:14px;
            font-weight:600;
        }

        .btn-success:hover{
            opacity:0.9;
        }

        .erro{
            display:none;
            background:#7f1d1d;
            color:white;
            padding:12px;
            border-radius:10px;
            text-align:center;
            margin-bottom:20px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>⚽ Quadra Solidária</h1>

        <p>Área administrativa</p>

        <div id="mensagemErro" class="erro">
            Usuário ou senha inválidos.
        </div>

        <form id="loginForm">

            <div class="mb-3">

                <label>Usuário</label>

                <input
                    type="text"
                    class="form-control"
                    id="username"
                    required>

            </div>

            <div class="mb-4">

                <label>Senha</label>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-success w-100">

                Entrar

            </button>

        </form>

    </div>

<script>

const form =
document.getElementById(
    'loginForm'
);

form.addEventListener(
    'submit',
    function(e){

    e.preventDefault();

    const usuario =
    document.getElementById(
        'username'
    ).value;

    const senha =
    document.getElementById(
        'password'
    ).value;

    const erro =
    document.getElementById(
        'mensagemErro'
    );

    const botao =
    document.querySelector(
        'button[type="submit"]'
    );

    const usuarioCorreto =
    'admin';

    const senhaCorreta =
    '123456';

    botao.disabled = true;
    botao.innerHTML =
    'Entrando...';

    erro.style.display =
    'none';

    setTimeout(() => {

        if(
            usuario === usuarioCorreto &&
            senha === senhaCorreta
        ){

            localStorage.setItem(
            'usuarioLogado', usuario
            );
            
            window.location.href =
            'dashboard.html';

        } 
        else {

            erro.style.display =
            'block';

            botao.disabled =
            false;

            botao.innerHTML =
            'Entrar';
        }

    }, 1200);

});

</script>

</body>

</html>
