<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Quadra Solidária</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body style="background:#0f172a;color:white;">

    <nav class="navbar navbar-dark bg-dark px-4">

        <span class="navbar-brand">
            ⚽ Quadra Solidária
        </span>

        <button id="btnSair" class="btn btn-danger">
            Sair
        </button>

    </nav>

    <div class="container py-5">

        <div class="text-center mb-5">

            <h1 id="tituloUsuario">
                Bem-vindo ao painel
            </h1>

            <p id="statusSistema">
                Carregando informações...
            </p>

        </div>

        <div class="row g-4">

            <div class="col-md-4">
                <div class="card p-4 bg-dark text-light">
                    <h3>Eventos</h3>
                    <p>Gerencie eventos esportivos</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-4 bg-dark text-light">
                    <h3>Campeonatos</h3>
                    <p>Gerencie ranking e equipes</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-4 bg-dark text-light">
                    <h3>Quadras</h3>
                    <p>Gerencie reservas</p>
                </div>
            </div>

        </div>

    </div>

    <script>

        const usuarioLogado =
        localStorage.getItem(
            'usuarioLogado'
        );

        if(!usuarioLogado){

            window.location.href =
            'login.html';
        }

        document.getElementById(
            'tituloUsuario'
        ).innerHTML =
        `Bem-vindo, ${usuarioLogado}`;
        
        const status =
        document.getElementById(
            'statusSistema'
        );

        setTimeout(() => {

            status.innerHTML =
            'Sistema carregado com sucesso ✅';

        }, 1500);

        const btnSair =
        document.getElementById(
            'btnSair'
        );

        btnSair.addEventListener(
            'click',
            function(e){

            e.preventDefault();

            btnSair.innerHTML =
            'Saindo...';

            btnSair.disabled =
            true;

            setTimeout(() => {

                localStorage.removeItem(
                    'usuarioLogado'
                );

                window.location.href =
                'index.html';

            }, 1200);

        });

    </script>

</body>

</html>
